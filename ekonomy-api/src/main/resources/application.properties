# Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:ekonomy}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:ekonomy}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/ekonomy}

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# Hibernate
quarkus.hibernate-orm.log.sql=false

# JWT
mp.jwt.verify.publickey.location=keys/publicKey.pem
mp.jwt.verify.issuer=ekonomy
smallrye.jwt.sign.key.location=keys/privateKey.pem

# CORS
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost:80
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-allow-credentials=true

# App admin seed
ekonomy.admin.email=${EKONOMY_ADMIN_EMAIL:admin@ekonomy.com}
ekonomy.admin.password=${EKONOMY_ADMIN_PASSWORD:ekonomy123}

# Dev profile overrides
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.log.level=INFO
