services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ekonomy
      POSTGRES_USER: ekonomy
      POSTGRES_PASSWORD: ekonomy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekonomy"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./ekonomy-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/ekonomy
      QUARKUS_DATASOURCE_USERNAME: ekonomy
      QUARKUS_DATASOURCE_PASSWORD: ekonomy
      EKONOMY_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ekonomy.com}
      EKONOMY_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ekonomy123}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./keys:/deployments/keys:ro

  ui:
    build:
      context: ./ekonomy-ui
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  postgres_data:
